  const find = t => { for (let i = 4; i + 4 < u8.length; i++) if (u8[i] === t.charCodeAt(0) && s(i) === t) return i - 4; return -1; };
  let moof = 0; for (let i = 4; i + 4 < u8.length; i++) if (u8[i] === 109 && s(i) === 'moof') moof++;
  const r = {moof}; const mv = find('mvhd'); if (mv >= 0) { const v = u8[mv + 8]; r.ts = dv.getUint32(mv + (v ? 28 : 20)); r.dur = v ? dv.getUint32(mv + 36) : dv.getUint32(mv + 24); }
  const c = find('colr'); if (c >= 0 && s(c + 8) === 'nclx') r.colr = {prim: dv.getUint16(c + 12), tr: dv.getUint16(c + 14), mat: dv.getUint16(c + 16), full: !!(u8[c + 18] & 0x80)};
  const ac = find('avcC'); if (ac >= 0) { const c = u8.subarray(ac + 8); if ((c[5] & 0x1f) >= 1) { const len = (c[6] << 8) | c[7]; const fr = spsRange(c.subarray(8, 8 + len)); r.sps = fr === null ? '?' : fr ? 'full' : 'limited'; } }
  r.codec = ['avc1', 'avc3', 'vp09', 'hvc1', 'mp4a', 'Opus'].filter(t => find(t) >= 0).join('+'); return r; }
function rms(ch, sr, a, b) { let s = 0, n = 0; for (let i = Math.floor(a * sr); i < Math.min(ch.length, b * sr); i++) { s += ch[i] * ch[i]; n++; } return n ? Math.sqrt(s / n) : 0; }
$('go').onclick = async () => {
  $('go').disabled = true; out.length = 0; const mime = env();
  if (!window.MediaRecorder || !cv.captureStream) { log('→ このブラウザでは動画を作れません'); st('おわり'); $('copy').disabled = false; return; }
  const a = new (window.AudioContext || window.webkitAudioContext)(); try { await a.resume(); } catch (_) {}
  log('■ 録画テスト'); log('音声のサンプルレート: ' + a.sampleRate + ' / 状態: ' + a.state);
  st('録画中…画面を開いたままにしてね');
  const dest = a.createMediaStreamDestination(), osc = a.createOscillator(), g = a.createGain(); osc.frequency.value = 440; g.gain.value = 0.3; osc.connect(g); g.connect(dest);
  let keep = null; try { keep = a.createConstantSource(); const kg = a.createGain(); keep.offset.value = 1; kg.gain.value = 0.00001; keep.connect(kg); kg.connect(dest); keep.start(); } catch (e) { log('無音キープ: 使えない ' + e.name); }
  const vs = cv.captureStream(30), stream = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
  let rec; try { rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 6000000, audioBitsPerSecond: 160000} : {}); } catch (e) { log('指定の形式で録画できず: ' + e.name); rec = new MediaRecorder(stream); }
  const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); }; const stopped = new Promise(r => rec.onstop = r);
  let hidden = false; const onVis = () => { if (document.hidden) hidden = true; }; document.addEventListener('visibilitychange', onVis);
  rec.start(500); const lead = 0.5, tone = 2.0, tail = 0.8, ts = a.currentTime + lead; osc.start(ts); osc.stop(ts + tone);
  const w0 = performance.now();
  await new Promise(res => { const f = () => { const now = a.currentTime; draw(now); if (now >= ts + tone + tail || performance.now() - w0 > 15000) { res(); return; } requestAnimationFrame(f); }; f(); });
  rec.stop(); await stopped; try { keep && keep.stop(); } catch (_) {} vs.getTracks().forEach(t => t.stop()); document.removeEventListener('visibilitychange', onVis);
  log('録画にかかった時間: ' + ((performance.now() - w0) / 1000).toFixed(2) + '秒（目安 3.3秒）' + (hidden ? ' ※途中で画面を離れた' : ''));
  log('録画の形式: ' + (rec.mimeType || '(不明)'));
  const raw = new Uint8Array(await new Blob(chunks).arrayBuffer()); log('元のファイル: ' + (raw.length / 1024).toFixed(0) + 'KB');
  const isMp4 = /mp4/.test(rec.mimeType || mime || '');
  let fixed = raw;
  if (isMp4) { const b0 = boxes(raw); log('元: 分割=' + b0.moof + ' / 長さ=' + (b0.ts ? (b0.dur / b0.ts).toFixed(2) + '秒' : '?') + ' / 中身=' + b0.codec + ' / 色ラベル=' + JSON.stringify(b0.colr || 'なし') + ' / 映像の中の範囲=' + (b0.sps || '?'));
    st('仕上げ中…'); try { const f = defragMp4(raw.buffer); if (f) fixed = f; log('仕上げ: ' + (f ? 'OK' : 'しなかった（分割なし）')); } catch (e) { log('仕上げ: エラー ' + e.message); }
    const b1 = boxes(fixed); log('後: 分割=' + b1.moof + ' / 長さ=' + (b1.ts ? (b1.dur / b1.ts).toFixed(2) + '秒' : '?') + ' / 色ラベル=' + JSON.stringify(b1.colr || 'なし') + ' / 映像の中の範囲=' + (b1.sps || '?')); }
  const blob = new Blob([fixed], {type: isMp4 ? 'video/mp4' : 'video/webm'}), url = URL.createObjectURL(blob);
  st('再生して色を調べています…');
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.src = url;
  try { await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('再生できない')); setTimeout(() => rej(new Error('タイムアウト')), 8000); });
    log('■ 再生テスト'); log('このブラウザが読んだ長さ: ' + v.duration + '秒（目安 3.3秒前後）');
    // iPhone Safari only paints a frame after the video has actually played, so play a moment, then pause
    try { await v.play(); } catch (_) {}
    await new Promise(r => { const chk = () => { if (v.currentTime >= 1.2) { v.pause(); r(); } }; v.ontimeupdate = chk; setTimeout(() => { v.pause(); r(); }, 4000); });
    await new Promise(r => setTimeout(r, 200));
    const c2 = document.createElement('canvas'); c2.width = 640; c2.height = 360; const x2 = c2.getContext('2d'); x2.drawImage(v, 0, 0, 640, 360);
    const px = (X, Y) => [...x2.getImageData(X, Y, 1, 1).data].slice(0, 3);
    const k = px(160, 60), wv = px(480, 60), gr = px(160, 300), pk = px(480, 300);
    log('黒: ' + k + '（0付近が正しい）/ 白: ' + wv + '（255付近が正しい）'); log('灰: ' + gr + '（128付近）/ ピンク: ' + pk + '（248,211,224付近）');
    if (wv[0] + wv[1] + wv[2] === 0) log('→ 色: このブラウザでは動画の色を読み取れませんでした');
    else { const washed = k[0] > 30 || wv[0] < 222; log('→ 色: ' + (washed ? '白っぽい・くすんでいる可能性あり' : 'OK')); }
  } catch (e) { log('再生テスト: ' + e.message); }
  try { const ab = await blob.arrayBuffer(); const buf = await a.decodeAudioData(ab); const ch = buf.getChannelData(0), sr = buf.sampleRate;
    log('■ 音声テスト'); log('音声の長さ: ' + buf.duration.toFixed(2) + '秒');
    let on = -1, off = -1; for (let t = 0; t < buf.duration; t += 0.01) { const r = rms(ch, sr, t, t + 0.01); if (r > 0.05) { if (on < 0) on = t; off = t + 0.01; } }
    log('音が鳴っていた区間: ' + on.toFixed(2) + '〜' + off.toFixed(2) + '秒（2.00秒ぶん鳴るのが正しい）→ ' + (off - on).toFixed(2) + '秒');
    log('→ 音の最後: ' + ((off - on) > 1.95 ? 'OK' : '切れている可能性あり'));
  } catch (e) { log('音声テスト: このブラウザでは確認できませんでした（' + e.name + '）'); }
  log('■ おわり'); st('おわり！「結果をコピー」を押して送ってね'); $('copy').disabled = false; $('go').disabled = false;
};
$('copy').onclick = async () => { try { await navigator.clipboard.writeText($('out').value); st('コピーしました'); } catch (_) { $('out').select(); document.execCommand('copy'); st('コピーしました'); } };
